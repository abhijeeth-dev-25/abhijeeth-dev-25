<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Abhijeethkar Geddam | I make ideas feel real</title><desc id="desc">Animated editorial developer card with orbital motion and a blinking build cursor.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14211f"/><stop offset="1" stop-color="#07100f"/></linearGradient>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#a0b8a8" stroke-opacity=".10"/></pattern>
<clipPath id="frame"><rect width="1200" height="520" rx="14"/></clipPath>
<style>
.orbit{transform-origin:934px 254px;animation:spin 28s linear infinite}
.orbit2{transform-origin:934px 254px;animation:spin 18s linear infinite reverse}
.pulse{animation:pulse 3s ease-in-out infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
.reveal{animation:reveal 1.5s ease-out both}
.scan{animation:scan 9s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes reveal{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes scan{0%,100%{transform:translateY(-100px);opacity:0}15%,85%{opacity:.65}50%{transform:translateY(520px)}}
@media (prefers-reduced-motion:reduce){.orbit,.orbit2,.pulse,.cursor,.reveal,.scan{animation:none!important}}
</style>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="520" fill="url(#bg)"/><rect width="1200" height="520" fill="url(#grid)"/>
<path d="M38 75H1162M38 435H1162" stroke="#a0baa8" stroke-opacity=".25"/>
<rect class="scan" x="0" y="0" width="1200" height="1" fill="#d7ff85" opacity=".6"/>
<text x="45" y="47" fill="#e6f2e5" font-size="15" letter-spacing="2" font-family="monospace">AG — LAB / 001</text>
<circle cx="1032" cy="42" r="5" fill="#d7ff85" class="pulse"/>
<text x="1048" y="47" fill="#c6d4ca" font-size="13" font-family="monospace">ALWAYS IN PROGRESS</text>
<g class="reveal">
<text x="45" y="149" fill="#d7ff85" font-family="monospace" letter-spacing="3" font-size="16">DESIGN-MINDED ENGINEER</text>
<text x="40" y="253" fill="#f4f5e9" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="700" letter-spacing="-4">I make ideas</text>
<text x="40" y="343" fill="#f4f5e9" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="700" letter-spacing="-4">feel <tspan fill="#d7ff85">real.</tspan></text>
<rect class="cursor" x="436" y="293" width="5" height="57" fill="#d7ff85"/>
<text x="46" y="394" fill="#b6c9b9" font-family="monospace" font-size="15">INTERFACE CRAFT  /  SYSTEMS THINKING  /  REAL PRODUCTS</text>
</g>
<g fill="none" stroke="#a9c4b3" stroke-opacity=".24"><circle cx="934" cy="254" r="190"/><circle cx="934" cy="254" r="146"/><circle cx="934" cy="254" r="102"/><path d="M744 254h380M934 64v380" stroke-dasharray="4 8"/></g>
<g class="orbit"><path d="M788 254a146 146 0 0 1 146 -146" fill="none" stroke="#d7ff85" stroke-width="3" stroke-linecap="round"/><circle cx="934" cy="108" r="7" fill="#d7ff85"/></g>
<g class="orbit2"><path d="M861 327a103 103 0 0 0 146 0" stroke="#e9f9e8" stroke-width="2"/><circle cx="1007" cy="327" r="5" fill="#e9f9e8"/></g>
<circle cx="934" cy="254" r="52" fill="#162a25" stroke="#d7ff85" stroke-opacity=".7"/>
<text x="934" y="259" font-family="monospace" font-size="15" text-anchor="middle" fill="#d7ff85">BUILD()</text>
<text x="44" y="479" font-family="monospace" fill="#e9f1e5" font-size="16" letter-spacing="2">ABHIJEETHKAR GEDDAM</text>
<text x="1155" y="479" text-anchor="end" font-family="monospace" fill="#a5baac" font-size="13">HYDERABAD / INDIA   •   SCROLL TO EXPLORE ↓</text>
</g></svg>